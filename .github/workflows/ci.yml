name: CI

# Триггеры запуска: при пуше в main и tests, а также при создании PR в эти ветки
on:
  push:
    branches:
      - main
      - tests
  pull_request:
    branches:
      - main
      - tests

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем uv
      # Он сам увидит версию Python (3.10+) в твоем pyproject.toml
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      # 3. Синхронизируем зависимости
      # Ставим все группы, включая dev (для ruff) и test (для pytest)
      - name: Install dependencies
        run: uv sync --all-groups

      # 4. Проверка стиля и логики (Ruff)
      - name: Lint with Ruff
        run: |
          uv run ruff check src/

      # 5. Запуск тестов (Pytest)
      - name: Run tests
        run: uv run pytest -v